name: get-kakao-token
on:
  workflow_dispatch:
    inputs:
      rest_api_key:
        description: 'REST API 키'
        required: true
      code:
        description: '인가 코드'
        required: true
      client_secret:
        description: '클라이언트 시크릿 (없으면 비워두세요)'
        required: false
        default: ''

jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange code for token
        run: |
          curl -s -X POST "https://kauth.kakao.com/oauth/token" \
            -d "grant_type=authorization_code" \
            -d "client_id=${{ github.event.inputs.rest_api_key }}" \
            -d "client_secret=${{ github.event.inputs.client_secret }}" \
            -d "redirect_uri=https://example.com/oauth" \
            -d "code=${{ github.event.inputs.code }}"
